# automatisation de la création de l'index de commandes Linux

# utilisation de https://github.com/stefanzweifel/git-auto-commit-action
# voir aussi https://github.com/orgs/community/discussions/25640

name: linux commands index generation

on:
  push:
    branches: [ "main", "dev2" ]

jobs:
  job_index:
# changed on 20261120, see readme.md  
#    runs-on: ubuntu-latest
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - run: g++ --version
      - run: sudo apt-get update
      - run: sudo apt-get install lsb-release
      - run: lsb_release -a
      - run: echo "shell=$SHELL"
      
      - name: Determination type
        run: cd content; ./get_type.sh

      - name: Compilation
        run: cd content; g++ linux_gen.cpp
      - name: Exécution
        run: cd content; ./a.out out.csv
      - run: ls -l /tmp
      - run: cat /tmp/manfile
      - run: rm content/out.csv

      - name: Ajout version OS
        run: |
          source /etc/os-release
          echo "_OS: $NAME - ${VERSION}_">> linux_cmds_list_alpha.md
          echo "_OS: $NAME - ${VERSION}_">> linux_cmds_list_cat.md
          echo "_OS: $NAME - ${VERSION}_">> linux_cmds_list_type.md

      - name: auto commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Automated Change
          branch: main
          commit_options: '--no-verify --signoff'
          commit_author: Author <actions@github.com>
          status_options: '--untracked-files=yes'
          skip_dirty_check: true


